# Conteúdo do curso — FONTE DA VERDADE.
# Edite aqui e rode `npm run course:build` para gerar src/data/course-content.ts.
# (o build já roda isso automaticamente via prebuild)
#
# Campos por aula: id, title, duration (obrigatórios); description; e a fonte do
# vídeo — `tella` (slug de tella.tv/video/<slug>) tem prioridade sobre `youtubeId`.
# Sem tella nem youtubeId, a aula mostra o placeholder "vídeo em produção".
#
# VELOCIDADE PADRÃO (1.2x): não dá pra setar pelo código. O embed do Tella é
# cross-origin e não tem parâmetro de URL de velocidade. A velocidade padrão é um
# setting POR VÍDEO no painel do Tella e vale também no embed. Ao publicar uma aula
# nova, abra o vídeo no Tella → Share → Viewer Settings → Default speed → 1.2x
# (opções nativas: 1.0 / 1.2 / 1.5 / 1.7 / 2.0). Confirme na área de membros que
# o player já sobe em 1.2x.

title: "Curso Claude Cowork para Advogados"
subtitle: "Automatize 100% do seu escritório"

modules:
  - id: comece-aqui
    title: "Comece aqui"
    description: "O primeiro contato com o Claude: o que é, quem está por trás e o que decidir antes de começar."
    thumbnailGradient: "linear-gradient(145deg, #1a0f0a 0%, #3d2218 40%, #d97757 100%)"
    coverImage: "/assets/images/temporadas/temporada-0-comece-aqui.png"
    lessons:
      - id: o-que-e-claude
        title: "O que é o Claude"
        tella: "01-ca-1-o-que-e-o-claude-f528"
        duration: "3:32"
        description: "Não é só mais um chatbot. Uma inteligência que lê, raciocina e responde no nível de um colega sênior."
      - id: o-que-e-anthropic
        title: "O que é a Anthropic"
        tella: "02-ca-2-o-que-e-a-anthropic-d1o3"
        duration: "4:15"
        description: "Quem está por trás do Claude e por que isso importa pra quem lida com dado sensível de cliente."
      - id: claude-vs-chatgpt
        title: "Claude vs ChatGPT"
        tella: "03-ca-3-claude-vs-chatgpt-ahkq"
        duration: "5:34"
        description: "Onde o Claude brilha no jurídico, onde o ChatGPT leva vantagem, e por que o curso aposta no Claude."
      - id: nivel-de-dificuldade
        title: "Nível de dificuldade para adaptação"
        tella: "04-ca-4-nivel-de-dificuldade-para-adaptacao-224s"
        duration: "6:09"
        description: "A curva real de aprendizado: suave, com vitórias rápidas nos primeiros dias. Precisa de curiosidade, não de ser técnico."
      - id: qual-plano-escolher
        title: "Qual plano escolher"
        tella: "05-ca-5-qual-plano-escolher-04qx"
        duration: "5:42"
        description: "Visão geral de Free, Pro e Max pra você não travar na largada. O suficiente pra começar certo."

  - id: fundacao-pratica
    title: "Fundação prática"
    description: "Do primeiro uau à primeira peça revisada. Aqui você para de assistir e começa a fazer."
    thumbnailGradient: "linear-gradient(145deg, #0a0a0a 0%, #1f1410 45%, #c2410c 100%)"
    coverImage: "/assets/images/temporadas/temporada-1-fundacao-pratica.png"
    lessons:
      - id: o-que-vai-aprender
        title: "O que você vai aprender no Módulo 1"
        tella: "10-intro-o-que-voce-vai-aprender-no-modulo-1-1-5ut1"
        duration: "4:27"
        description: "O trailer do módulo em poucos minutos: a jornada do primeiro uau à primeira petição revisada."
      - id: 5-superpoderes
        title: "Os 5 superpoderes do Claude que mais ajudam advogados"
        tella: "11-os-5-superpoderes-do-claude-que-mais-ajudam-advogados-1-5crm"
        duration: "9:34"
        description: "Ler processos inteiros, dissecar contratos e laudos, criar peças e calculadoras do zero. A aula do encantamento."
      - id: escritorio-seguro-ia
        title: "Seu escritório está seguro para usar IA?"
        tella: "12-seu-escritorio-esta-seguro-para-usar-ia-4uuo"
        duration: "15:20"
        description: "As configurações de privacidade que todo advogado precisa ativar, e o que o Claude faz (e não faz) com o dado do cliente. LGPD e OAB desarmados."
      - id: o-que-e-contexto
        title: "O que é o contexto"
        tella: "13-o-que-e-contexto-326q"
        duration: "10:15"
        description: "O conceito mais importante do curso. O que o Claude tem em mente em cada conversa, e o que acontece quando estoura."
      - id: ambientes-claude
        title: "Chat, Projects, Chrome e Cowork: quando usar cada ambiente"
        tella: "14-chat-projects-chrome-e-cowork-quando-usar-cada-ambiente-dggd"
        duration: "7:02"
        description: "Chat pra dúvida pontual, Projects pro contexto permanente, Cowork pro Claude agindo nos seus arquivos. Quando usar cada um."
      - id: quatro-pilares-delegar
        title: "Quatro pilares para delegar"
        tella: "15-quatro-pilares-para-delegar-8e1r"
        duration: "9:00"
        description: "Contexto, exemplos, formato e verificação. Os quatro pilares que separam um pedido vago de uma delegação que o Claude executa direito."
      - id: assinaria-sem-conferir
        title: "Você assinaria sem conferir?"
        tella: "16-voce-assinaria-sem-conferir-2o7b"
        duration: "8:56"
        description: "A regra de ouro na prática: você assina, você responde. Revisão humana é inegociável, por mais convincente que a resposta pareça."

  - id: instrucoes-basicas
    title: "Instruções básicas"
    description: "Os ajustes de base pra usar o Claude com segurança: privacidade, importação de dados e memória. O feijão com arroz que evita dor de cabeça depois."
    thumbnailGradient: "linear-gradient(145deg, #0a0a0a 0%, #1a1410 45%, #b45309 100%)"
    lessons:
      - id: configuracoes-privacidade
        title: "Configurações e privacidade no Claude"
        tella: "instrucoes-basicas-iii-configuracoes-e-privacidade-no-claude-8ox6"
        duration: "3:59"
        description: "As configurações de privacidade que todo advogado precisa conferir antes de subir qualquer coisa de cliente."
      - id: importacao-de-dados
        title: "Importação de dados para o Claude"
        tella: "instrucoes-basicas-iv-importacao-de-dados-para-o-claude-df5w"
        duration: "4:01"
        description: "Como colocar seus documentos e dados dentro do Claude do jeito certo, sem bagunça e sem vazar o que não devia."
      - id: gravacao-de-memorias
        title: "Gravação básica de memórias"
        tella: "instrucoes-basicas-v-gravacao-basica-de-memorias-9k7z"
        duration: "4:57"
        description: "Como fazer o Claude lembrar do que importa entre conversas, sem precisar repetir tudo toda vez."

  - id: skills
    title: "Skills"
    description: "O teto do curso: transformar seus padrões de trabalho em skills que o Claude aciona sozinho. É aqui que o escritório vira linha de produção."
    thumbnailGradient: "linear-gradient(145deg, #0a0a0a 0%, #1f1410 45%, #d97757 100%)"
    lessons:
      - id: introducao-skills
        title: "Introdução ao módulo de Skills"
        tella: "introducao-ao-modulo-de-skills-no-cloud-68sx"
        duration: "5:21"
        description: "O que você vai construir neste módulo e por que skills são o pulo do gato pra industrializar o escritório."
      - id: prompts-vs-skills
        title: "Prompts vs. Skills: qual a diferença"
        tella: "prompts-vs-skills-qual-a-diferenca-euuq"
        duration: "2:03"
        description: "Prompt é o pedido da vez, skill é o padrão que fica. Quando usar cada um e por que confundir os dois trava seu ganho de escala."
      - id: verificar-seguranca-skills
        title: "Como verificar a segurança de novas skills"
        tella: "como-verificar-a-seguranca-de-novas-skills-80c9"
        duration: "7:23"
        description: "Antes de instalar uma skill de terceiro, o que olhar pra não abrir a porta pro que não devia."
      - id: navegacao-e-skills
        title: "Dicas de navegação e skills no Claude"
        tella: "dicas-de-navegacao-e-skills-no-claude-eo75"
        duration: "6:24"
        description: "Atalhos e manhas do dia a dia pra achar, acionar e alternar entre skills sem perder o fio."
      - id: gerenciar-compartilhar-skills
        title: "Gerenciar, compartilhar e atualizar suas skills"
        tella: "como-gerenciar-compartilhar-e-atualizar-suas-skills-de-ia-1sp2"
        duration: "14:59"
        description: "Como manter sua biblioteca de skills organizada, dividir com a equipe e atualizar sem quebrar o que já funciona."
